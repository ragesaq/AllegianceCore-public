name: publish-guard
on:
  push:
    branches: ['**']   # a new tag has no "before" commit and would rescan all history; its commits were scanned on the branch push
  pull_request:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan new commits (identity, secrets, personal email, home paths, Meshy)
        env:
          ALLOW_MEDIA: "1"   # CI lists new media; the local pre-push hook makes the reviewer confirm it
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE=${{ github.event.pull_request.base.sha }}; HEAD=${{ github.event.pull_request.head.sha }};
          else BASE=${{ github.event.before }}; HEAD=${{ github.sha }}; fi
          DEFAULT=${{ github.event.repository.default_branch }}
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git merge-base "origin/$DEFAULT" "$HEAD")   # a new branch: only commits not yet on the default branch
          elif ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # A force-push: the old tip was not fetched. A rewrite of the default branch itself fails closed.
            [ "${{ github.ref }}" != "refs/heads/$DEFAULT" ] || { echo "[publish-guard] $BASE is not in the clone: $DEFAULT was rewritten"; exit 1; }
            BASE=$(git merge-base "origin/$DEFAULT" "$HEAD")
          fi
          bash scripts/publish-guard.sh "$BASE" "$HEAD"
